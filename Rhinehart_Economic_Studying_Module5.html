<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhinehart Tradeoff Review</title>
    <style>
      :root {
        --bg: #eefcf8;
        --card: rgba(255,255,255,0.72);
        --teal: #146f73;
        --teal-deep: #0d4c51;
        --gold: #f7d570;
        --peach: #f7b187;
        --ink: #1d3438;
        --muted: #5b727a;
        --success: #1f8f67;
        --danger: #d15d52;
        --border: rgba(18, 69, 74, 0.15);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.72), transparent 24%),
          radial-gradient(circle at 80% 18%, rgba(72, 176, 175, 0.26), transparent 22%),
          radial-gradient(circle at 50% 100%, rgba(255, 173, 101, 0.10), transparent 28%),
          linear-gradient(180deg, #dffaf7 0%, #cfeef0 30%, #bfe2e6 52%, #a8d5d9 100%);
        color: var(--ink);
        overflow-x: hidden;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
        pointer-events: none;
      }
      .page-bubbles {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        top: var(--top);
        left: var(--left);
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        opacity: 0.70;
        border: 1px solid rgba(255,255,255,0.8);
        background: radial-gradient(circle at 30% 28%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.8) 18%, rgba(248, 203, 166, 0.9) 36%, rgba(245, 157, 104, 0.74) 62%, rgba(219, 108, 70, 0.44) 80%, rgba(255,255,255,0.06) 100%);
        box-shadow: inset 0 0 12px rgba(255,255,255,0.8), 0 0 22px rgba(255, 200, 150, 0.12);
        animation: ambientFloat var(--duration) ease-in-out infinite alternate;
        animation-delay: var(--delay);
      }
      .sea-floor {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 110px;
        background: linear-gradient(180deg, rgba(234, 201, 149, 0.9), rgba(196, 156, 95, 0.96));
        border-top: 1px solid rgba(112, 84, 56, 0.18);
        box-shadow: 0 -12px 26px rgba(73, 52, 38, 0.12);
        z-index: 0;
      }
      @keyframes ambientFloat {
        0% { transform: translate3d(0, 0, 0) scale(0.85); opacity: 0.08; }
        25% { opacity: 0.42; }
        50% { transform: translate3d(var(--drift1), var(--rise1), 0) scale(1.02); opacity: 0.7; }
        75% { transform: translate3d(var(--drift2), var(--rise2), 0) scale(1.08); opacity: 0.36; }
        100% { transform: translate3d(var(--drift3), var(--rise3), 0) scale(1.12); opacity: 0.05; }
      }
      .app {
        position: relative;
        z-index: 1;
        width: min(920px, 100%);
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(21, 70, 77, 0.08);
        border-radius: 26px;
        box-shadow: 0 18px 50px rgba(16, 71, 77, 0.14);
        padding: 22px;
        backdrop-filter: blur(8px);
      }
      .hero {
        text-align: center;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        color: var(--teal-deep);
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 22px;
      }
      .hidden { display: none; }
      .visible { display: block; }
      .quiz-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 14px;
      }
      .scenario {
        margin: 0 0 18px;
        line-height: 1.6;
        font-size: clamp(1.12rem, 2vw, 1.35rem);
      }
      .question-text {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .options-grid {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }
      .option-btn {
        background: linear-gradient(180deg, #ffffff, #edfdfa);
        border: 1px solid rgba(18, 69, 74, 0.12);
        border-radius: 14px;
        padding: 14px 16px;
        text-align: left;
        cursor: pointer;
        color: var(--ink);
        font-size: 1rem;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .option-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(12, 63, 63, 0.12);
      }
      .option-btn:disabled {
        cursor: default;
        opacity: 0.9;
      }
      .primary-btn {
        display: block;
        margin: 20px auto 0;
        background: linear-gradient(135deg, #1d7b7d, #0d5b60);
        color: white;
        border: none;
        padding: 12px 22px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .feedback {
        min-height: 1.5rem;
        margin-top: 16px;
        font-weight: 700;
        line-height: 1.6;
      }
      .feedback.correct { color: var(--success); }
      .feedback.wrong { color: var(--danger); }
      .explanation {
        margin-top: 12px;
        padding: 14px 16px;
        border-left: 4px solid rgba(20, 111, 115, 0.7);
        background: rgba(255,255,255,0.52);
        border-radius: 12px;
        line-height: 1.7;
        font-size: 0.97rem;
      }
      .summary-card {
        margin-top: 16px;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      @media (max-width:560px){
        .quiz-meta { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="page-bubbles" aria-hidden="true">
      <span class="bubble" style="--top: 8%; --left: 8%; --size: 70px; --duration: 18s; --delay: 0s; --drift1: 22px; --rise1: 24px; --drift2: -18px; --rise2: -18px; --drift3: 16px; --rise3: 36px;"></span>
      <span class="bubble" style="--top: 14%; --left: 28%; --size: 110px; --duration: 22s; --delay: 1.4s; --drift1: -26px; --rise1: 30px; --drift2: 18px; --rise2: -18px; --drift3: 12px; --rise3: 42px;"></span>
      <span class="bubble" style="--top: 10%; --left: 54%; --size: 86px; --duration: 20s; --delay: 0.8s; --drift1: 24px; --rise1: 28px; --drift2: -20px; --rise2: -22px; --drift3: 18px; --rise3: 34px;"></span>
      <span class="bubble" style="--top: 18%; --left: 72%; --size: 96px; --duration: 24s; --delay: 2.2s; --drift1: -18px; --rise1: 24px; --drift2: 26px; --rise2: -30px; --drift3: -12px; --rise3: 40px;"></span>
      <span class="bubble" style="--top: 26%; --left: 14%; --size: 120px; --duration: 26s; --delay: 1.8s; --drift1: 18px; --rise1: 40px; --drift2: -30px; --rise2: -18px; --drift3: 10px; --rise3: 52px;"></span>
      <span class="bubble" style="--top: 34%; --left: 40%; --size: 78px; --duration: 17s; --delay: 0.3s; --drift1: -22px; --rise1: 18px; --drift2: 26px; --rise2: -18px; --drift3: -14px; --rise3: 32px;"></span>
      <span class="bubble" style="--top: 30%; --left: 82%; --size: 70px; --duration: 19s; --delay: 0.9s; --drift1: 16px; --rise1: 30px; --drift2: -24px; --rise2: -25px; --drift3: 20px; --rise3: 36px;"></span>
      <span class="bubble" style="--top: 44%; --left: 6%; --size: 130px; --duration: 30s; --delay: 1.5s; --drift1: 30px; --rise1: 38px; --drift2: -20px; --rise2: -30px; --drift3: 12px; --rise3: 44px;"></span>
      <span class="bubble" style="--top: 52%; --left: 32%; --size: 100px; --duration: 24s; --delay: 2.6s; --drift1: -22px; --rise1: 26px; --drift2: 18px; --rise2: -18px; --drift3: 16px; --rise3: 40px;"></span>
      <span class="bubble" style="--top: 62%; --left: 58%; --size: 72px; --duration: 18s; --delay: 1.1s; --drift1: 20px; --rise1: 24px; --drift2: -18px; --rise2: -30px; --drift3: 10px; --rise3: 32px;"></span>
      <span class="bubble" style="--top: 68%; --left: 86%; --size: 82px; --duration: 21s; --delay: 2.1s; --drift1: -24px; --rise1: 28px; --drift2: 22px; --rise2: -20px; --drift3: -16px; --rise3: 38px;"></span>
      <span class="bubble" style="--top: 74%; --left: 18%; --size: 88px; --duration: 23s; --delay: 0.5s; --drift1: 18px; --rise1: 22px; --drift2: -16px; --rise2: -26px; --drift3: 14px; --rise3: 36px;"></span>
    </div>
    <div class="sea-floor" aria-hidden="true"></div>

    <div class="app">
      <header class="hero">
        <h1>Scarcity & Tradeoff Review</h1>
        <p class="subtitle">Practice the core ideas behind choices, cost, and tradeoffs in a real-world context.</p>
      </header>

      <main>
        <section id="quiz-screen" class="panel visible">
          <div class="quiz-meta">
            <span id="question-count">Question 1 of 10</span>
            <span id="score-count">Score: 0/10</span>
          </div>

          <h2 id="scenario-text" class="scenario"></h2>
          <h3 id="question-text" class="question-text"></h3>
          <div id="answer-options" class="options-grid"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
          <div id="explanation-box" class="explanation hidden"></div>
          <button id="next-btn" class="primary-btn hidden" type="button">Next Question</button>
        </section>

        <section id="summary-screen" class="panel hidden">
          <h2>Review Complete</h2>
          <p id="summary-text" class="summary-card"></p>
          <button id="restart-btn" class="primary-btn" type="button">Restart</button>
          <button id="menu-btn" class="primary-btn" style="margin-top: 12px; background: linear-gradient(135deg, #f3d0a2, #de9b70); color: #22373d;" type="button">Return to Menu</button>
        </section>
      </main>
    </div>

    <script>
      const scenarios = [
        {
          name: 'Carter',
          scenario: 'Carter only has $20 for the week and must choose between buying groceries or going to a concert. He decides to buy groceries.',
          question: 'What is the tradeoff in Carter\'s decision?',
          options: [
            'The groceries he bought',
            'The concert experience he gave up',
            'The price of the groceries',
            'The amount of money he has left'
          ],
          correctIndex: 1,
          explanation: 'A tradeoff is what you give up when you make a choice. By choosing groceries, Carter gave up the value of attending the concert. Scarcity forces people to make choices, and each choice involves tradeoffs.'
        },
        {
          name: 'Morgan',
          scenario: 'Morgan has one hour before work and can either review notes for a quiz or take a nap. She chooses to review notes.',
          question: 'Which statement best explains the opportunity cost of Morgan\'s choice?',
          options: [
            'The one hour used to study',
            'The rest she gave up by not napping',
            'The quiz itself',
            'The time it takes to travel to work'
          ],
          correctIndex: 1,
          explanation: 'The opportunity cost is what is sacrificed when one option is chosen over another. Morgan gave up the value of resting, which is the best alternative not chosen.'
        },
        {
          name: 'Casey',
          scenario: 'Casey is deciding whether to spend one more hour studying or playing a game. The extra hour of studying may raise her quiz grade by a small amount, but the game would be enjoyable right now.',
          question: 'What should Casey use to decide whether the extra hour is worth it?',
          options: [
            'Marginal analysis',
            'Comparative advantage',
            'Inflation',
            'Market equilibrium'
          ],
          correctIndex: 0,
          explanation: 'Marginal analysis compares the additional benefit of one more unit with the additional cost. Casey should ask whether the next hour of study raises her grade enough to justify giving up the enjoyment of gaming.'
        },
        {
          name: 'Allie',
          scenario: 'Allie bought a nonrefundable $25 ticket to a movie and then found out she had two exams the next day. She feels like she must go because she spent the money.',
          question: 'What economics idea helps explain the better decision?',
          options: [
            'Opportunity cost',
            'Sunk cost',
            'Supply and demand',
            'Production possibilities frontier'
          ],
          correctIndex: 1,
          explanation: 'The $25 is a sunk cost because it cannot be recovered. The rational decision should be based on the value of attending the movie now compared with studying, not on money already spent.'
        },
        {
          name: 'Taylor',
          scenario: 'Taylor can choose between working a shift for $40 or helping a friend move for free. She chooses to work.',
          question: 'What is the opportunity cost of Taylor\'s choice?',
          options: [
            'The $40 earned from working',
            'The friend\'s gratitude',
            'The value of helping a friend move',
            'The gas used to travel to work'
          ],
          correctIndex: 2,
          explanation: 'The opportunity cost is the value of the best alternative given up. By choosing work, Taylor gave up the benefit of helping a friend move, which may have included friendship and goodwill.'
        },
        {
          name: 'Priya',
          scenario: 'Priya is trying to decide how to spend a Saturday morning with only a few hours available. She can clean her room, study, or go for a run. She chooses study.',
          question: 'What does the fact that her time is limited illustrate?',
          options: [
            'Scarcity',
            'Comparative advantage',
            'Elasticity',
            'Gross domestic product'
          ],
          correctIndex: 0,
          explanation: 'Scarcity exists because resources, including time, are limited. Priya cannot do all three activities at once, so she must choose the option that provides the greatest value to her.'
        },
        {
          name: 'Jordan',
          scenario: 'Jordan has enough money to buy either a used bicycle or a new pair of running shoes. He chooses the bicycle because it helps him commute to work.',
          question: 'Why is the running shoes not just an “unused item” but a real cost in this decision?',
          options: [
            'Because they are unnecessary',
            'Because they represent the next-best alternative forgone',
            'Because they are always more expensive',
            'Because the bicycle is a sunk cost'
          ],
          correctIndex: 1,
          explanation: 'The running shoes are not the amount spent; they represent the benefit Jordan gave up by choosing the bicycle. That forgone benefit is the opportunity cost of his decision.'
        },
        {
          name: 'Riley',
          scenario: 'Riley is preparing for a long exam week. She can spend an extra hour on economics or an extra hour on history. Both subjects matter, but she has limited time.',
          question: 'What economic idea is Riley facing?',
          options: [
            'Tradeoff',
            'Market failure',
            'Opportunity revenue',
            'Capital gain'
          ],
          correctIndex: 0,
          explanation: 'Choosing one subject means giving up time that could have been used for the other. This is a clear tradeoff: limited time forces Riley to decide which benefit is more important right now.'
        },
        {
          name: 'Leo',
          scenario: 'Leo has a free evening and can either work on his personal business idea or spend time with his family. He chooses to work on the business idea.',
          question: 'What is the opportunity cost of Leo\'s decision?',
          options: [
            'The business plan he created',
            'The time with his family he gave up',
            'The amount of money he earns later',
            'The fact that he is tired afterward'
          ],
          correctIndex: 1,
          explanation: 'Opportunity cost is the value of the best alternative forgone, not the money saved or spent. By choosing to work on the business idea, Leo gave up quality time with family, which is the value he sacrificed.'
        },
        {
          name: 'Nina',
          scenario: 'Nina has a small budget for groceries. She can either buy fresh produce or buy a few convenience snacks. She chooses the fresh produce.',
          question: 'Which statement best describes Nina\'s tradeoff?',
          options: [
            'She is maximizing costs',
            'She is choosing the next-best alternative over the other option',
            'She has no opportunity cost because she saved money',
            'She is ignoring scarcity altogether'
          ],
          correctIndex: 1,
          explanation: 'Scarcity means limited money and time force choices. Nina gave up the convenience snacks in order to buy fresh produce, and that forgone benefit is the tradeoff she accepted.'
        }
      ];

      const questionCountEl = document.getElementById('question-count');
      const scoreCountEl = document.getElementById('score-count');
      const scenarioTextEl = document.getElementById('scenario-text');
      const questionTextEl = document.getElementById('question-text');
      const answerOptionsEl = document.getElementById('answer-options');
      const feedbackEl = document.getElementById('feedback');
      const explanationBoxEl = document.getElementById('explanation-box');
      const nextBtn = document.getElementById('next-btn');
      const summaryScreen = document.getElementById('summary-screen');
      const quizScreen = document.getElementById('quiz-screen');
      const summaryTextEl = document.getElementById('summary-text');
      const restartBtn = document.getElementById('restart-btn');
      const menuBtn = document.getElementById('menu-btn');

      let currentIndex = 0;
      let score = 0;
      let answered = false;

      function renderQuestion() {
        const current = scenarios[currentIndex];
        answered = false;

        questionCountEl.textContent = `Question ${currentIndex + 1} of ${scenarios.length}`;
        scoreCountEl.textContent = `Score: ${score}/${scenarios.length}`;
        scenarioTextEl.textContent = current.scenario;
        questionTextEl.textContent = current.question;
        answerOptionsEl.innerHTML = '';
        feedbackEl.className = 'feedback';
        feedbackEl.textContent = '';
        explanationBoxEl.classList.add('hidden');
        explanationBoxEl.textContent = '';
        nextBtn.classList.add('hidden');

        current.options.forEach((option, optionIndex) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'option-btn';
          button.textContent = option;
          button.addEventListener('click', () => handleAnswer(optionIndex, current));
          answerOptionsEl.appendChild(button);
        });
      }

      function handleAnswer(selectedIndex, current) {
        if (answered) return;
        answered = true;

        const buttons = answerOptionsEl.querySelectorAll('.option-btn');
        buttons.forEach((button, index) => {
          button.disabled = true;
          if (index === current.correctIndex) {
            button.style.background = 'linear-gradient(180deg, #e7f7ee, #d7f1e3)';
            button.style.borderColor = 'rgba(31, 143, 103, 0.6)';
          }
          if (index === selectedIndex && index !== current.correctIndex) {
            button.style.background = 'linear-gradient(180deg, #fdeceb, #f9d7d3)';
            button.style.borderColor = 'rgba(209, 93, 82, 0.7)';
          }
        });

        const isCorrect = selectedIndex === current.correctIndex;
        if (isCorrect) {
          score += 1;
          feedbackEl.textContent = 'Correct!';
          feedbackEl.classList.add('correct');
        } else {
          feedbackEl.textContent = 'Not quite.';
          feedbackEl.classList.add('wrong');
        }

        scoreCountEl.textContent = `Score: ${score}/${scenarios.length}`;

        const correctText = current.options[current.correctIndex];
        explanationBoxEl.innerHTML = `
          <strong>${isCorrect ? 'Why this is correct:' : 'Correct answer:'}</strong> ${correctText}<br><br>
          ${current.explanation}
        `;
        explanationBoxEl.classList.remove('hidden');

        if (currentIndex < scenarios.length - 1) {
          nextBtn.classList.remove('hidden');
        } else {
          nextBtn.textContent = 'See Summary';
          nextBtn.classList.remove('hidden');
        }
      }

      function showSummary() {
        quizScreen.classList.add('hidden');
        summaryScreen.classList.remove('hidden');
        const percent = Math.round((score / scenarios.length) * 100);
        summaryTextEl.innerHTML = `You scored <strong>${score}/${scenarios.length}</strong> (${percent}%).<br><br>Scarcity and tradeoffs are at the center of economic thinking. Every choice involves giving up something else, and the best decisions come from understanding what is being sacrificed and what is gained in return.`;
      }

      function nextQuestion() {
        if (currentIndex < scenarios.length - 1) {
          currentIndex += 1;
          renderQuestion();
        } else {
          showSummary();
        }
      }

      function restartQuiz() {
        currentIndex = 0;
        score = 0;
        quizScreen.classList.remove('hidden');
        summaryScreen.classList.add('hidden');
        nextBtn.textContent = 'Next Question';
        renderQuestion();
      }

      nextBtn.addEventListener('click', nextQuestion);
      restartBtn.addEventListener('click', restartQuiz);
      menuBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      renderQuestion();
    </script>
  </body>
</html>
